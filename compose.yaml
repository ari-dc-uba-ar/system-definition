name: system-definition

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: node:24.21.0-bookworm-slim
    working_dir: /workspace
    init: true
    environment:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/system_definition
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: system_definition
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: system_definition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d system_definition"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  node_modules:
  postgres_data:
